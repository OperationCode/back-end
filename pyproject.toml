[tool.poetry]
name = "back-end"
version = "0.1.0"
description = ""
authors = ["Allen Anthes <allen@operationcode.org>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
argon2-cffi = "^25"
bcrypt = "^4.3"
boto3 = "^1.42"                             # Was ^1.13 - ensures urllib3 >= 2.6.3
cryptography = "^48.0"
django = "^5.2"                             # Keep at 5.x for now
djangorestframework = "^3.16"               # Was ^3.14 - fixes CVE-2024-21520
djangorestframework-camel-case = "^1.4"     # Was ^1.0
djangorestframework-simplejwt = "^5.3"      # Keep (works with Django 4.2)
django-allauth = "^65.0"
django-anymail = "^14.0"
django-q2 = "^1.7"
blessed = "^1.20"
django-cors-headers = "^4.6"
dj-rest-auth = "^7.0"
django-split-settings = "^1.3"
django-storages = "^1.14"
django-unfold = "^0"
drf-yasg = "^1.21"
gunicorn = "^26"
psycopg2 = "^2.9"
python-decouple = "^3.8"
mailchimp3 = "^3.0"
requests = "^2.32"
urllib3 = "^2.6.3"
sentry-sdk = "^2.49"
django-allow-cidr = "^0.8"
django-health-check = "^3.20"               # Was ^3.18

[tool.poetry.group.dev.dependencies]
bandit = "^1.9"
coverage = "^7.0"
django-debug-toolbar = "^5.0"               # Was ^4.4 (6.x has API changes)
factory_boy = "^3.3"
pyhumps = "^3.8"
pytest = ">=9.0"
pytest-django = "^4.8"
pytest-env = "^1.1"
pytest-mock = "^3.14"
responses = "^0.26"
ruff = "^0.15"
pytest-cov = "^7.0.0"

[tool.ruff]
line-length = 88
exclude = [
    "*/migrations/*",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry>=2.3.0"]
build-backend = "poetry.masonry.api"
